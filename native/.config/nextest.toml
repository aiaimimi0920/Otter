# Run each test in a separate process to prevent cascaded PoisonError failures from in-process SERIAL locks.
# Run six pure algorithm/protocol tests concurrently; serialize desktop-window/clipboard/capture/Live focus tests to avoid global-handle contention.

[profile.default]
test-threads = 6
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 3 }
status-level = "fail"
final-status-level = "flaky"

[test-groups.win32-serial]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(otter-native) or binary(integration) or test(/clipboard|capture|window|focus|popup|hover|uia|live_window_target::input_/)'
test-group = 'win32-serial'

[profile.headless]
# Exclude interactive input-focus tests on a locked/UAC/noninteractive desktop when OpenInputDesktop returns SecureDesktop.
test-threads = 6
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 3 }
status-level = "fail"
final-status-level = "flaky"
default-filter = 'not test(/live_window_target::input_|live_browser_scroll::refresh::tests::|live_source_uia::process::tests::source_uia_owned_edit/)'

[[profile.headless.overrides]]
filter = 'package(otter-native) or binary(integration) or test(/clipboard|capture|window|focus|popup|hover|uia/)'
test-group = 'win32-serial'
