[package]
name = "otter-native"
version = "0.3.1"
edition = "2021"
license = "MIT"
publish = false
description = "Otter Windows native migration host"

[workspace]
members = ["hover-hook", "otter-core", "otter-media", "otter-runtime"]
resolver = "2"

[features]
# Keep scoped-tests disabled by default so normal/CI builds run all unit tests; targeted iteration can enable a domain feature to compile only its tests.
scoped-tests = []
test-live = ["scoped-tests"]
test-surface = ["scoped-tests"]
test-save = ["scoped-tests"]
test-capture = ["scoped-tests"]
test-loom = ["scoped-tests"]
test-canvas = ["scoped-tests"]
# Self-check subsystem: retained in Debug and unit tests; excluded from normal Release builds unless integration smoke tests are explicitly enabled.
smoke-test = []

[dependencies]
otter-core = { path = "otter-core", version = "=0.3.1" }
otter-media = { path = "otter-media", version = "=0.3.1" }
otter-runtime = { path = "otter-runtime", version = "=0.3.1" }
base64 = "=0.22.1"
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
png = "=0.18.1"
image-webp = "=0.2.4"
tiny-webp = { version = "=0.1.1", default-features = false }
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
svgtypes = "=0.16.1"
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
moxcms = { version = "=0.8.1", default-features = false, features = ["lut"] }
sha2 = "=0.10.9"
uuid = { version = "=1.29.3", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
webpki-roots = "=1.0.11"
ring = "=0.17.14"
zeroize = "=1.9.1"
tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }
url = "=2.5.9"
ureq = { version = "=3.4.2", default-features = false }
qrcode = { version = "=0.14.1", default-features = false }
# Pin the upstream chrono-optional fix until it reaches a registry release.
rxing = { git = "https://github.com/rxing-core/rxing", rev = "912b1083ffd164b29e6b244e4845de9df06b107a", version = "=0.9.4", default-features = false, features = ["decoders", "qrcode", "encoding_rs"] }

[dev-dependencies]
otter-core = { path = "otter-core", version = "=0.3.1", features = ["test-support"] }
otter-media = { path = "otter-media", version = "=0.3.1", features = ["test-support"] }
otter-runtime = { path = "otter-runtime", version = "=0.3.1", features = ["test-support"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.60.0", features = ["Win32_UI_Input_Pointer"] }

[target.'cfg(windows)'.dependencies]
otter-live-hover-hook = { path = "hover-hook", version = "=0.3.1" }
neuro-mini-ui = { git = "https://github.com/aiaimimi0920/NeuroDesign", rev = "02420e8d129cf952c6bee3cda96ab7ebc95c2d67", version = "=0.1.0" }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
windows-core = "=0.60.1"
windows = { version = "=0.60.0", features = [
    "ApplicationModel_DataTransfer",
    "Storage_Streams",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_Touch",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

# Per-package optimization: prioritize host UI/control-flow size; maximize vectorization and unrolling for pixel operations and image codecs.
# Performance audit optimization (Tier 0.3):
# Override workspace `opt-level = "s"` on hot runtime, deflate/zlib/checksum, Base64, QuickJS C VM, and font/curve
# crates so LTO does not propagate LLVM `optsize` (or MSVC `/Os` on `rquickjs-sys`) into inner pixel/codec/VM loops.
[profile.release.package.otter-core]
opt-level = 3
[profile.release.package.otter-media]
opt-level = 3
[profile.release.package.otter-runtime]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.resvg]
opt-level = 3
[profile.release.package.usvg]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.zlib-rs]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
[profile.release.package.tiny-webp]
opt-level = 3
[profile.release.package.moxcms]
opt-level = 3
[profile.release.package.base64]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.rquickjs-sys]
opt-level = 3
[profile.release.package.rquickjs-core]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package.read-fonts]
opt-level = 3
[profile.release.package.kurbo]
opt-level = 3

# See third_party/README.md for traceable patches and integrity gates.
[patch.crates-io]
resvg = { path = "../third_party/resvg-0.48.1" }
usvg = { path = "../third_party/usvg-0.48.1" }
tiny-skia = { path = "../third_party/tiny-skia-0.12.0" }
roxmltree = { path = "../third_party/roxmltree-0.21.1" }
