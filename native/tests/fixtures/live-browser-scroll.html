<!doctype html>
<meta charset="utf-8">
<title>Otter Live Input Probe</title>
<style>
  body { margin: 0; height: 6000px; background: linear-gradient(#eee, #acf); }
  #nested { position: fixed; left: 400px; top: 180px; width: 350px; height: 250px; overflow: auto; }
  #content { width: 1200px; height: 1800px; background: linear-gradient(#faa, #afa); }
  #below { position: absolute; top: 1000px; }
</style>
<!-- Ordinary role-free overflow containers must also receive scrolling; admission to ControlView must not depend on tabindex/ARIA. -->
<div id="nested">
  <div id="content">Nested scroll test</div>
</div>
<div id="below"></div>
<script>
  // Offscreen accessible controls previously exhausted the 256-node budget, permanently disabling Controller after the first scroll.
  // count=0 retains a simple-page control; 350 and 1000 cover long pages without accessing external sites or user data.
  const count = Math.min(1000, Math.max(0, Number(new URL(location).searchParams.get('count') ?? 350)));
  for (let i = 0; i < count; i++) {
    const button = document.createElement('button');
    button.textContent = `Item ${i}`;
    below.append(button);
  }
  window.probe = { wheels: 0 };
  addEventListener('wheel', () => probe.wheels++);
</script>
