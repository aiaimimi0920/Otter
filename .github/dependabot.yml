version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/native"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 4
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      cargo-cross-directory:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
