name: Build Otter EXE

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout complete change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI change classification and gate contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py'
      - name: Classify immutable event diff
        id: scope
        run: python3 scripts/ci_change_scope.py
      - name: Validate documentation-only changes
        if: steps.scope.outputs.full == 'false'
        run: python3 scripts/check_changed_docs.py
  build-windows-candidate:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate product versions before build setup
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-release-version.ps1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt

      - name: Setup isolated native test runner
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-nextest@0.9.140

      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native

      - name: Fetch locked native dependencies
        shell: powershell
        run: |
          if (-not (Get-Command rc.exe,llvm-rc.exe -ErrorAction SilentlyContinue)) {
            $env:OTTER_NATIVE_RC = Join-Path $env:ProgramFiles 'LLVM\bin\llvm-rc.exe'
            if (-not (Test-Path -LiteralPath $env:OTTER_NATIVE_RC -PathType Leaf)) { throw 'Windows resource compiler not found' }
            "OTTER_NATIVE_RC=$env:OTTER_NATIVE_RC" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          cargo fetch --locked --manifest-path native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check repository and build-tool contracts
        shell: powershell
        env:
          OTTER_NATIVE_CANDIDATE_TEST_ROOT: ${{ runner.temp }}/otter-contract-tests
        run: |
          node scripts/release/third-party-sources.cjs .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OTTER_NATIVE_LICENSE_METADATA = Join-Path $env:RUNNER_TEMP 'otter-cargo-metadata.json'
          $metadata = @(cargo metadata --locked --offline --format-version 1 --manifest-path native/Cargo.toml)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText($env:OTTER_NATIVE_LICENSE_METADATA, ($metadata -join "`n"), [Text.UTF8Encoding]::new($false))
          $contracts = @(Get-ChildItem -LiteralPath scripts/tests -Filter native-*.test.cjs -File | ForEach-Object FullName)
          if ($contracts.Count -eq 0) { throw 'Native build-tool contracts not found' }
          node --test scripts/tests/effective-code-lines.test.mjs scripts/tests/javascript-license-supplements.test.cjs @contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/tests -p test_native_package_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/effective-code-lines.mjs --mode strict

      - name: Run native tests with the locked graph
        shell: powershell
        run: |
          cargo fmt --all --check --manifest-path native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --offline --workspace --manifest-path native/Cargo.toml --config-file native/.config/nextest.toml --profile default --test-threads 1 --no-tests=fail --fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --doc --locked --offline --workspace --manifest-path native/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify the native Windows internal package
        shell: powershell
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'otter-native-candidate'
          $target = Join-Path $env:RUNNER_TEMP 'otter-native-release-target'
          $package = Join-Path $env:RUNNER_TEMP 'otter-native-package'
          & .\scripts\build-native-candidate.ps1 -OutputDirectory $candidate -TargetDirectory $target
          & .\scripts\package-native-candidate.ps1 -CandidateDirectory $candidate -OutputDirectory $package
          $zip = @(Get-ChildItem -LiteralPath $package -Filter '*-internal.zip' -File)
          if ($zip.Count -ne 1) { throw 'Expected exactly one native ZIP' }
          & .\scripts\verify-native-package.ps1 -ZipPath $zip[0].FullName
          python scripts/tests/native-package-runtime.py --package-dir $package --evidence-dir (Join-Path $env:RUNNER_TEMP 'otter-runtime')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage verified native internal package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: otter-build-candidate
          path: |
            ${{ runner.temp }}/otter-native-package/*-internal.zip
            ${{ runner.temp }}/otter-native-package/archive-verification.json
          if-no-files-found: error
          retention-days: 1

  # Keep the stable check even on docs-only changes. Only a successful scope
  # check may skip product gates; only all product gates can promote an EXE.
  build-windows-exe:
    needs: [change-scope, build-windows-candidate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the selected gates
        shell: bash
        env:
          SCOPE: ${{ needs.change-scope.result }}
          FULL: ${{ needs.change-scope.outputs.full }}
          BUILD: ${{ needs.build-windows-candidate.result }}
        run: |
          test "$SCOPE" = success
          if [ "$FULL" = false ]; then
            test "$BUILD" = skipped
            echo 'Documentation checks passed; no executable was built.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$FULL" = true
          test "$BUILD" = success
      - name: Download same-run candidate
        if: needs.change-scope.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otter-build-candidate
          path: candidate
      - name: Upload portable Otter native package
        if: needs.change-scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: otter-portable-windows-x64
          path: |
            candidate/*-internal.zip
            candidate/archive-verification.json
          if-no-files-found: error
