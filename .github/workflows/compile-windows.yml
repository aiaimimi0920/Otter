name: Compile Windows (no package)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/target
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check compilation receipt contracts
        shell: powershell
        run: python -m unittest discover -s scripts/tests -p test_ci_compilation.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native

      - name: Compile the locked Windows workspace
        shell: powershell
        run: |
          if (-not (Get-Command rc.exe,llvm-rc.exe -ErrorAction SilentlyContinue)) {
            $env:OTTER_NATIVE_RC = Join-Path $env:ProgramFiles 'LLVM\bin\llvm-rc.exe'
            if (-not (Test-Path -LiteralPath $env:OTTER_NATIVE_RC -PathType Leaf)) { throw 'Windows resource compiler not found' }
          }
          cargo build --locked --release --workspace --manifest-path native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record compilation evidence without package approval
        shell: powershell
        run: |
          python scripts/ci_compilation_receipt.py --expected-sha "$env:GITHUB_SHA" --output "$env:RUNNER_TEMP/otter-compilation-receipt.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Compilation only: no test, package, runtime or formal release approval. The build-windows-exe gate is unchanged." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload compilation receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: otter-windows-compilation-receipt
          path: ${{ runner.temp }}/otter-compilation-receipt.json
          if-no-files-found: error
          retention-days: 7
